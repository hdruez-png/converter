<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertisseur de devises</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Convertisseur de devises</h1>
    <p class="subtitle">Taux vérifiés en ligne (taux de référence BCE)</p>

    <label for="amount">Montant</label>
    <input id="amount" type="number" min="0" step="any" value="100">

    <div class="row">
      <div class="field">
        <label for="from">De</label>
        <select id="from"></select>
      </div>

      <button id="swap" type="button" title="Inverser les devises" aria-label="Inverser les devises">⇄</button>

      <div class="field">
        <label for="to">Vers</label>
        <select id="to"></select>
      </div>
    </div>

    <p id="result" class="result">…</p>
    <p id="rate" class="rate"></p>
    <p id="meta" class="meta"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
